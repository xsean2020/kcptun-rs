[workspace]
members = [
    "kcp-rs",
    "kcrypt-rs",
    "smux-rs",
    "qpp-rs",
    "knet-rs",
    "kpprof-rs",
    "kcptun-common",
    "kcptun-client",
    "kcptun-server",
]
resolver = "2"

[workspace.dependencies]
thiserror = "2"
async-trait = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# For flamegraphs / samply: keep symbols, frame pointers, no LTO so stacks are human-readable.
# Usage: RUSTFLAGS="-C force-frame-pointers=yes" cargo build --profile profiling --features pprof -p kcptun-server -p kcptun-client
#
# IMPORTANT: Always pass -C force-frame-pointers=yes (or use `make profiling-bins`)
# when building for SIGPROF-based profilers (pprof-rs, samply). Without frame
# pointers, ~40% of CPU samples get "stuck" at libc/pthread boundaries
# (e.g. __pthread_atfork_parent_handlers, unix_madvise) with flat==cum,
# unable to attribute to the Rust caller.
[profile.profiling]
inherits = "release"
lto = false
codegen-units = 16
strip = false
debug = 2
# Keep panic=abort from release for similar codegen shape; symbols still present.
