[package]
name = "kcp-rs"
version = "0.2.7"
edition = "2021"
description = "KCP protocol implementation in Rust - reliable UDP transport"

[dependencies]
bytes = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
reed-solomon-erasure = "6"
smallvec = "1"
thiserror.workspace = true
async-trait.workspace = true
# Optional async runtime + I/O (KcpStream). Enable via `async` feature.
knet-rs = { path = "../knet-rs", default-features = false, optional = true }
# Optional pprof for profiling examples (build with --features pprof)
kpprof-rs = { path = "../kpprof-rs", default-features = false, optional = true }

[dev-dependencies]
# Integration tests for KcpStream need a runtime.
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
libc = "0.2"
# Used by the latency example's worker-count diagnostics.
num_cpus = "1"

[features]
default = []
# Async KcpStream over knet (tokio runtime).
async = ["dep:knet-rs"]
# pprof HTTP server for profiling (use with --profile profiling)
pprof = ["dep:kpprof-rs", "kpprof-rs/tokio"]
