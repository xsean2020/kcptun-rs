[package]
name = "knet-rs"
version = "0.1.0"
edition = "2021"
description = "Tokio-based network I/O extensions for kcptun (mmsg, tcpraw, cpu_block)"

[lib]
name = "knet"

[dependencies]
async-lock = "3"
async-channel = "2"
# `all` enables Type::RAW + set_header_included_v4 needed by Linux tcpraw.
socket2 = { version = "0.5", features = ["all"] }
log = "0.4"
libc = "0.2"
tokio = { version = "1", default-features = false, features = ["net", "time", "macros", "rt", "rt-multi-thread", "io-util", "sync"] }
