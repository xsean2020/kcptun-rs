[package]
name = "smux-rs"
version = "0.1.0"
edition = "2021"
description = "SMUX stream multiplexer for kcptun"

[dependencies]
bytes = "1"
log = "0.4"
parking_lot = "0.12"
knet-rs = { path = "../knet-rs", default-features = false }
thiserror.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
clap = { version = "4", features = ["derive"] }

[features]
default = ["tokio"]
tokio = []
