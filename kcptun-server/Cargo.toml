[package]
name = "kcptun-server"
version = "0.1.0"
edition = "2021"
description = "kcptun server binary"

[dependencies]
kcp-rs = { path = "../kcp-rs" }
kcrypt-rs = { path = "../kcrypt-rs" }
kcptun-common = { path = "../kcptun-common", default-features = false }
smux-rs = { path = "../smux-rs", default-features = false }
knet-rs = { path = "../knet-rs", default-features = false }
clap = { version = "4", default-features = false, features = ["derive", "env", "std", "help", "usage", "error-context"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
anyhow = "1"
socket2 = "0.5"
mimalloc = { version = "0.1", default-features = false }
kpprof-rs = { path = "../kpprof-rs", optional = true, default-features = false }

[features]
default = ["tokio", "qpp", "pprof"]
# Go-compatible pprof HTTP endpoint (--pprof).
pprof = ["dep:kpprof-rs"]
# Deadlock detection (adds parking_lot deadlock_detection overhead).
pprof-deadlock = ["pprof", "kpprof-rs/deadlock"]
tokio = ["smux-rs/tokio", "kcptun-common/tokio", "kpprof-rs?/tokio"]
# Quantum Permutation Pad stream obfuscation. Optional to keep ARM binaries small.
qpp = ["kcptun-common/qpp"]

[[bin]]
name = "kcptun-server"
path = "src/main.rs"

[dev-dependencies]
async-trait = "0.1"
async-channel = "1"
