[package]
name = "kcrypt-rs"
version = "0.1.0"
edition = "2021"
description = "Shared block/AEAD cipher library for kcptun-rs (Go kcp-go wire-compatible)"

[dependencies]
bytes = "1"
aes = "0.8"
getrandom = "0.2"
sha1 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
twofish = "0.7"
blowfish = "0.9"
des = "0.8"
aes-gcm = "0.10"
crc32fast = "1"
parking_lot = "0.12"
thiserror.workspace = true

[features]
default = ["wire"]
# Marker feature: wire framing (CryptoBuf / encrypt_batch / offload) is always compiled.
wire = []
